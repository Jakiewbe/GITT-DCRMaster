[package]
name = "gitt-dcr-scientific-workbench"
version = "0.1.0-beta.1"
description = "PulseLab offline, auditable GITT and DCR scientific workbench"
authors = ["Jakiewbe"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gitt_dcr_scientific_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
